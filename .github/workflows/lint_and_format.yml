name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    name: Lint and format checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: |
          set +e
          npm run lint 2>&1 | tee lint-results.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=ESLint failed::Run npm run lint:fix locally, review the changes, then commit the fixes."
            exit "$status"
          fi

      - name: Check Prettier formatting
        id: format
        run: |
          set +e
          npm run format:check 2>&1 | tee format-results.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Prettier check failed::Run npm run format locally, review the changes, then commit the fixes."
            exit "$status"
          fi
