name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/acquisitions_test' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: |
          set +e
          npm test 2>&1 | tee test-results.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Test suite failed::npm test failed. Review the test log in this job and fix the failing test cases."
            exit "$status"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Write test summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Status: Passed"
            else
              echo "- Status: Failed"
              echo "- Fix: Review the test output above and rerun npm test locally."
            fi
            if [ -d coverage ]; then
              echo "- Coverage: Generated and uploaded as the coverage-report artifact."
            else
              echo "- Coverage: No coverage directory was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
